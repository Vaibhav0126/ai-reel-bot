name: Daily Nib Meal Reel

on:
  schedule:
    # ~7:00 PM JST = 10:00 UTC (offset a few minutes to avoid GitHub's
    # top-of-the-hour scheduler congestion, which can delay/skip :00 crons)
    - cron: "9 10 * * *"
  workflow_dispatch:

concurrency:
  group: daily-meal-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-meal-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Generate and post meal reel
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDGE_TTS_VOICE: en-US-AnaNeural
          EDGE_TTS_RATE: "+20%"
          EDGE_TTS_PITCH: "+0Hz"
          AUTO_POST: "false"
        run: python bot/run_daily.py --type meal --post

      - name: Persist used meals
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/data/used_meals.json
          if git diff --staged --quiet; then
            echo "No used_meals changes to commit."
          else
            git commit -m "chore: update used meals after daily meal reel"
            git push
          fi
