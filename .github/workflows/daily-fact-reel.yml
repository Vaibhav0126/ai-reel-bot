name: Daily Nib Fact Short

# One Short a day, uploaded PRIVATE and scheduled to go public at 12:00 US
# Eastern (PUBLISH_TIMEZONE / PUBLISH_HOUR). The run happens ~13-14 hours
# earlier (12:17 JST), which leaves time to watch it in YouTube Studio and
# unschedule it if it's not good enough.

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC = 12:17 JST (offset from :00 to avoid scheduler congestion)
  workflow_dispatch:

concurrency:
  group: daily-fact-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fact-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Generate and schedule today's Short
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLISH_TIMEZONE: America/New_York
          PUBLISH_HOUR: "12"
        run: python bot/run_daily.py --post

      - name: Persist used facts and upload stats
        # always(): if the upload fails after the fact was marked used, the
        # fact must still be recorded so tomorrow's run doesn't repeat it.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/data/used_facts.json bot/data/uploads.json 2>/dev/null || git add bot/data/used_facts.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update used facts and upload stats"
            git pull --rebase
            git push
          fi
