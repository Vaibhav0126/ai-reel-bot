name: Daily Nib Reel

on:
  schedule:
    # ~1:00 PM JST = 04:00 UTC (offset a few minutes to avoid GitHub's
    # top-of-the-hour scheduler congestion, which can delay/skip :00 crons)
    - cron: "7 4 * * *"
  workflow_dispatch:

concurrency:
  group: daily-reel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Generate and post fridge reel
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDGE_TTS_VOICE: en-US-AnaNeural
          EDGE_TTS_RATE: "+20%"
          EDGE_TTS_PITCH: "+0Hz"
          AUTO_POST: "false"
        run: python bot/run_daily.py --type fridge --post

      - name: Persist used topics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/data/used_topics.json
          if git diff --staged --quiet; then
            echo "No used_topics changes to commit."
          else
            git commit -m "chore: update used topics after daily reel"
            git push
          fi
